# InSight local development stack.
#
# Run from the repository root so the root .env is picked up:
#
#   docker compose --env-file .env -f infra/docker-compose.yml up -d
#   docker compose --env-file .env -f infra/docker-compose.yml ps
#   docker compose --env-file .env -f infra/docker-compose.yml down       # keep data
#   docker compose --env-file .env -f infra/docker-compose.yml down -v    # wipe data
#
# Every image here is free and runs locally. Ollama is deliberately absent
# - see the note below the services. Langfuse is the SELF-HOSTED
# build, never the SaaS — the hosted version would send board prompts outside
# the client tenancy and break locked decision 2.
#
# Tags are loose for first pull. Pin them to exact versions once the stack
# comes up clean; INS-33 needs reproducible CI.

name: insight

services:

  # --------------------------------------------------------------------------
  # PostgreSQL + pgvector — application data, vectors, audit chain.
  # Also hosts the spicedb and langfuse databases as separate databases.
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: insight-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insight}
      POSTGRES_USER: ${POSTGRES_USER:-insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      INSIGHT_AUDIT_USER: ${POSTGRES_AUDIT_USER:-insight_audit}
      INSIGHT_AUDIT_PASSWORD: ${POSTGRES_AUDIT_PASSWORD:?set POSTGRES_AUDIT_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insight} -d ${POSTGRES_DB:-insight}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Redis — cache, and the Streams backbone behind the WebSocket fan-out.
  # appendonly so a restart does not lose un-replayed stream entries.
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: insight-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Qdrant — alternate vector store, and the source of BM25 sparse vectors
  # for hybrid retrieval (INS-23).
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: insight-qdrant
    environment:
      # No phoning home. This is confidential client work.
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "6333:6333"   # http / dashboard
      - "6334:6334"   # grpc
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # SpiceDB — fine-grained document and meeting permissions WITHIN a
  # workspace. Hard tenant isolation is Postgres RLS, not this.
  # Schema is loaded at INS-10.
  # --------------------------------------------------------------------------
  spicedb-migrate:
    image: authzed/spicedb:latest
    container_name: insight-spicedb-migrate
    command:
      - migrate
      - head
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://${POSTGRES_USER:-insight}:${POSTGRES_PASSWORD}@postgres:5432/spicedb?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  spicedb:
    image: authzed/spicedb:latest
    container_name: insight-spicedb
    command:
      - serve
      - --grpc-preshared-key=${SPICEDB_PRESHARED_KEY:?set SPICEDB_PRESHARED_KEY in .env}
      - --datastore-engine=postgres
      - --datastore-conn-uri=postgres://${POSTGRES_USER:-insight}:${POSTGRES_PASSWORD}@postgres:5432/spicedb?sslmode=disable
    ports:
      - "50051:50051"   # grpc
      - "8443:8443"     # http
    depends_on:
      postgres:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Langfuse — SELF-HOSTED observability: cost, latency, tokens, quality.
  # Never the SaaS build. See ADR-001.
  # --------------------------------------------------------------------------
  langfuse:
    image: langfuse/langfuse:2
    container_name: insight-langfuse
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-insight}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Ollama is NOT containerised.
  #
  # It is already installed natively on Windows with the models pulled, so a
  # container would mean a second copy on disk and a full re-download into an
  # empty volume. The API and worker run natively too, so they reach it on
  # localhost:11434 directly - OLLAMA_BASE_URL in .env.
  #
  # Nothing in this compose stack calls Ollama.
  #
  # If a containerised service ever needs it, use
  # http://host.docker.internal:11434 rather than adding a service here.
  # --------------------------------------------------------------------------

volumes:
  pgdata:
  redisdata:
  qdrantdata:

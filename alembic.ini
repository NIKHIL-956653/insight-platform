# Alembic configuration.
#
# There is deliberately no sqlalchemy.url here. The database password would
# end up committed. migrations/env.py reads it from Settings instead, which
# reads .env - the same path the application uses.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
path_separator = os

# Prefix new revision files with a sortable timestamp so the migrations
# directory reads in order rather than by random hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# ruff ships a compiled binary rather than a Python console_scripts entry
# point, so the console_scripts hook type cannot find it.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
